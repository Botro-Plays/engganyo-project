name: Deploy Gate

# This workflow is the single source of truth for deployment readiness.
# It validates that BOTH CI and E2E check runs have completed successfully
# for the SAME commit SHA using GitHub's native Checks API.

on:
  push:
    branches: [main]

jobs:
  validate-deployment-readiness:
    name: Validate CI + E2E success for same SHA
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: read

    steps:
      - name: Validate deployment readiness
        run: |
          set -e
          
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          
          echo "=== Deploy Gate Validation (Check Suites API) ==="
          echo "Commit SHA: $COMMIT_SHA"
          echo "Repository: $REPO"
          
          # Query check suites for this commit using GitHub Check Suites API
          echo "=== Fetching check suites for SHA $COMMIT_SHA ==="
          SUITES=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/commits/$COMMIT_SHA/check-suites" \
            --jq '.check_suites')
          
          # Filter for GitHub Actions app, completed status, and success conclusion
          SUITES_FILTERED=$(echo "$SUITES" | jq '[.[] | select(.app.slug == "github-actions" and .status == "completed" and .conclusion == "success")]')
          
          if [ "$SUITES_FILTERED" = "null" ] || [ "$SUITES_FILTERED" = "[]" ]; then
            echo "❌ No successful GitHub Actions check suites found for SHA $COMMIT_SHA. Blocking deployment."
            echo "Available check suites:"
            echo "$SUITES" | jq -r '.[] | "  App: \(.app.slug), Status: \(.status), Conclusion: \(.conclusion), Head SHA: \(.head_sha)"' || true
            exit 1
          fi
          
          # Group suites by workflow name and select latest for each
          echo "=== Identifying CI and E2E suites ==="
          
          # Extract workflow names from check runs within suites
          CI_SUITE=$(echo "$SUITES_FILTERED" | jq '[.[] | select(.check_runs[].name | contains("CI") and (.check_runs[].name | contains("E2E") | not))] | sort_by(.created_at) | reverse | .[0]')
          E2E_SUITE=$(echo "$SUITES_FILTERED" | jq '[.[] | select(.check_runs[].name | contains("E2E"))] | sort_by(.created_at) | reverse | .[0]')
          
          if [ "$CI_SUITE" = "null" ] || [ -z "$CI_SUITE" ]; then
            echo "❌ CI check suite not found for SHA $COMMIT_SHA. Blocking deployment."
            echo "Available suites:"
            echo "$SUITES_FILTERED" | jq -r '.[] | "  Created: \(.created_at), Check runs: \([.check_runs[].name] | join(\", \"))"' || true
            exit 1
          fi
          
          if [ "$E2E_SUITE" = "null" ] || [ -z "$E2E_SUITE" ]; then
            echo "❌ E2E check suite not found for SHA $COMMIT_SHA. Blocking deployment."
            echo "Available suites:"
            echo "$SUITES_FILTERED" | jq -r '.[] | "  Created: \(.created_at), Check runs: \([.check_runs[].name] | join(\", \"))"' || true
            exit 1
          fi
          
          # Validate CI suite
          CI_SUITE_ID=$(echo "$CI_SUITE" | jq -r '.id')
          CI_SUITE_SHA=$(echo "$CI_SUITE" | jq -r '.head_sha')
          CI_SUITE_STATUS=$(echo "$CI_SUITE" | jq -r '.status')
          CI_SUITE_CONCLUSION=$(echo "$CI_SUITE" | jq -r '.conclusion')
          
          echo "CI suite:"
          echo "  Suite ID: $CI_SUITE_ID"
          echo "  Head SHA: $CI_SUITE_SHA"
          echo "  Status: $CI_SUITE_STATUS"
          echo "  Conclusion: $CI_SUITE_CONCLUSION"
          
          if [ "$CI_SUITE_STATUS" != "completed" ]; then
            echo "❌ CI suite not completed (status: $CI_SUITE_STATUS). Blocking deployment."
            exit 1
          fi
          
          if [ "$CI_SUITE_CONCLUSION" != "success" ]; then
            echo "❌ CI suite did not succeed (conclusion: $CI_SUITE_CONCLUSION). Blocking deployment."
            exit 1
          fi
          
          if [ "$CI_SUITE_SHA" != "$COMMIT_SHA" ]; then
            echo "❌ CI suite SHA mismatch. Expected: $COMMIT_SHA, Got: $CI_SUITE_SHA. Blocking deployment."
            exit 1
          fi
          
          echo "CI: success (check suite matched)"
          
          # Validate E2E suite
          E2E_SUITE_ID=$(echo "$E2E_SUITE" | jq -r '.id')
          E2E_SUITE_SHA=$(echo "$E2E_SUITE" | jq -r '.head_sha')
          E2E_SUITE_STATUS=$(echo "$E2E_SUITE" | jq -r '.status')
          E2E_SUITE_CONCLUSION=$(echo "$E2E_SUITE" | jq -r '.conclusion')
          
          echo "E2E suite:"
          echo "  Suite ID: $E2E_SUITE_ID"
          echo "  Head SHA: $E2E_SUITE_SHA"
          echo "  Status: $E2E_SUITE_STATUS"
          echo "  Conclusion: $E2E_SUITE_CONCLUSION"
          
          if [ "$E2E_SUITE_STATUS" != "completed" ]; then
            echo "❌ E2E suite not completed (status: $E2E_SUITE_STATUS). Blocking deployment."
            exit 1
          fi
          
          if [ "$E2E_SUITE_CONCLUSION" != "success" ]; then
            echo "❌ E2E suite did not succeed (conclusion: $E2E_SUITE_CONCLUSION). Blocking deployment."
            exit 1
          fi
          
          if [ "$E2E_SUITE_SHA" != "$COMMIT_SHA" ]; then
            echo "❌ E2E suite SHA mismatch. Expected: $COMMIT_SHA, Got: $E2E_SUITE_SHA. Blocking deployment."
            exit 1
          fi
          
          echo "E2E: success (check suite matched)"
          echo "SHA consistency: OK"
          echo "DEPLOYMENT: APPROVED"
          echo ""
          echo "✅ All validations passed:"
          echo "   - CI suite: completed + success (SHA matched)"
          echo "   - E2E suite: completed + success (SHA matched)"
          echo "   - SHA consistency: OK"
          echo "   - Deployment is authorized"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
