name: Deploy Gate

# This workflow is the single source of truth for deployment readiness.
# It validates that BOTH CI and E2E workflows have completed successfully
# for the SAME commit SHA before allowing deployment to proceed.

on:
  workflow_run:
    workflows: ["CI", "E2E Tests"]
    types: [completed]
    branches: [main]

jobs:
  validate-deployment-readiness:
    name: Validate CI + E2E success for same SHA
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Validate deployment readiness
        run: |
          set -e
          
          TRIGGERING_WORKFLOW="${{ github.event.workflow_run.name }}"
          TRIGGERING_SHA="${{ github.event.workflow_run.head_sha }}"
          TRIGGERING_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          
          echo "=== Deploy Gate Validation ==="
          echo "Triggered by: $TRIGGERING_WORKFLOW"
          echo "Commit SHA: $TRIGGERING_SHA"
          echo "Conclusion: $TRIGGERING_CONCLUSION"
          
          # If the triggering workflow failed, block deployment immediately
          if [ "$TRIGGERING_CONCLUSION" != "success" ]; then
            echo "❌ Triggering workflow ($TRIGGERING_WORKFLOW) failed. Blocking deployment."
            exit 1
          fi
          
          # Fetch ALL CI runs and filter by exact SHA match (strict SHA locking)
          echo "=== Fetching CI run for SHA $TRIGGERING_SHA (strict SHA locking) ==="
          CI_RUNS=$(gh run list --workflow=CI --limit 100 --json databaseId,headSha,status,conclusion,createdAt --jq ".[]")
          
          # Filter for exact SHA match, completed status, and success conclusion
          CI_MATCHING_RUN=$(echo "$CI_RUNS" | jq --arg SHA "$TRIGGERING_SHA" '[.[] | select(.headSha == $SHA and .status == "completed" and .conclusion == "success")] | sort_by(.createdAt) | reverse | .[0]')
          
          if [ "$CI_MATCHING_RUN" = "null" ] || [ -z "$CI_MATCHING_RUN" ]; then
            echo "❌ No successful CI run found for SHA $TRIGGERING_SHA. Blocking deployment."
            echo "Available CI runs:"
            echo "$CI_RUNS" | jq -r '.[] | "  SHA: \(.headSha), Status: \(.status), Conclusion: \(.conclusion), Created: \(.createdAt)"' || true
            exit 1
          fi
          
          CI_RUN_ID=$(echo "$CI_MATCHING_RUN" | jq -r '.databaseId')
          CI_SHA=$(echo "$CI_MATCHING_RUN" | jq -r '.headSha')
          CI_STATUS=$(echo "$CI_MATCHING_RUN" | jq -r '.status')
          CI_CONCLUSION=$(echo "$CI_MATCHING_RUN" | jq -r '.conclusion')
          
          echo "CI: success (SHA matched)"
          echo "  Run ID: $CI_RUN_ID"
          echo "  SHA: $CI_SHA"
          echo "  Status: $CI_STATUS"
          echo "  Conclusion: $CI_CONCLUSION"
          
          # Fetch ALL E2E runs and filter by exact SHA match (strict SHA locking)
          echo "=== Fetching E2E run for SHA $TRIGGERING_SHA (strict SHA locking) ==="
          E2E_RUNS=$(gh run list --workflow="E2E Tests" --limit 100 --json databaseId,headSha,status,conclusion,createdAt --jq ".[]")
          
          # Filter for exact SHA match, completed status, and success conclusion
          E2E_MATCHING_RUN=$(echo "$E2E_RUNS" | jq --arg SHA "$TRIGGERING_SHA" '[.[] | select(.headSha == $SHA and .status == "completed" and .conclusion == "success")] | sort_by(.createdAt) | reverse | .[0]')
          
          if [ "$E2E_MATCHING_RUN" = "null" ] || [ -z "$E2E_MATCHING_RUN" ]; then
            echo "❌ No successful E2E run found for SHA $TRIGGERING_SHA. Blocking deployment."
            echo "Available E2E runs:"
            echo "$E2E_RUNS" | jq -r '.[] | "  SHA: \(.headSha), Status: \(.status), Conclusion: \(.conclusion), Created: \(.createdAt)"' || true
            exit 1
          fi
          
          E2E_RUN_ID=$(echo "$E2E_MATCHING_RUN" | jq -r '.databaseId')
          E2E_SHA=$(echo "$E2E_MATCHING_RUN" | jq -r '.headSha')
          E2E_STATUS=$(echo "$E2E_MATCHING_RUN" | jq -r '.status')
          E2E_CONCLUSION=$(echo "$E2E_MATCHING_RUN" | jq -r '.conclusion')
          
          echo "E2E: success (SHA matched)"
          echo "  Run ID: $E2E_RUN_ID"
          echo "  SHA: $E2E_SHA"
          echo "  Status: $E2E_STATUS"
          echo "  Conclusion: $E2E_CONCLUSION"
          
          # Final SHA consistency validation
          echo "=== Validating SHA consistency ==="
          if [ "$CI_SHA" != "$TRIGGERING_SHA" ] || [ "$E2E_SHA" != "$TRIGGERING_SHA" ]; then
            echo "❌ SHA mismatch detected!"
            echo "Expected SHA: $TRIGGERING_SHA"
            echo "CI SHA: $CI_SHA"
            echo "E2E SHA: $E2E_SHA"
            exit 1
          fi
          
          echo "SHA consistency: OK"
          echo "DEPLOYMENT: APPROVED"
          echo ""
          echo "✅ All validations passed:"
          echo "   - CI workflow: success (SHA matched)"
          echo "   - E2E workflow: success (SHA matched)"
          echo "   - SHA consistency: OK"
          echo "   - Deployment is authorized"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
