name: Deploy Gate

# This workflow is the single source of truth for deployment readiness.
# It validates that BOTH CI and E2E check runs have completed successfully
# for the SAME commit SHA using GitHub's native Checks API.

on:
  push:
    branches: [main]

jobs:
  validate-deployment-readiness:
    name: Validate CI + E2E success for same SHA
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: read

    steps:
      - name: Validate deployment readiness
        run: |
          set -e
          
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          
          echo "=== Deploy Gate Validation (Checks API) ==="
          echo "Commit SHA: $COMMIT_SHA"
          echo "Repository: $REPO"
          
          # Query check runs for this commit using GitHub Checks API
          echo "=== Fetching check runs for SHA $COMMIT_SHA ==="
          CHECKS=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/commits/$COMMIT_SHA/check-runs" \
            --jq '.check_runs')
          
          # Find CI check run
          CI_CHECK=$(echo "$CHECKS" | jq --arg NAME "CI" '[.[] | select(.name == $NAME)] | .[0]')
          
          if [ "$CI_CHECK" = "null" ] || [ -z "$CI_CHECK" ]; then
            echo "❌ CI check run not found for SHA $COMMIT_SHA. Blocking deployment."
            echo "Available check runs:"
            echo "$CHECKS" | jq -r '.[] | "  Name: \(.name), Status: \(.status), Conclusion: \(.conclusion)"' || true
            exit 1
          fi
          
          CI_STATUS=$(echo "$CI_CHECK" | jq -r '.status')
          CI_CONCLUSION=$(echo "$CI_CHECK" | jq -r '.conclusion')
          
          echo "CI check:"
          echo "  Status: $CI_STATUS"
          echo "  Conclusion: $CI_CONCLUSION"
          
          if [ "$CI_STATUS" != "completed" ]; then
            echo "❌ CI check not completed (status: $CI_STATUS). Blocking deployment."
            exit 1
          fi
          
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "❌ CI check did not succeed (conclusion: $CI_CONCLUSION). Blocking deployment."
            exit 1
          fi
          
          echo "CI: success (check completed)"
          
          # Find E2E check run
          E2E_CHECK=$(echo "$CHECKS" | jq --arg NAME "E2E Tests" '[.[] | select(.name == $NAME)] | .[0]')
          
          if [ "$E2E_CHECK" = "null" ] || [ -z "$E2E_CHECK" ]; then
            echo "❌ E2E check run not found for SHA $COMMIT_SHA. Blocking deployment."
            echo "Available check runs:"
            echo "$CHECKS" | jq -r '.[] | "  Name: \(.name), Status: \(.status), Conclusion: \(.conclusion)"' || true
            exit 1
          fi
          
          E2E_STATUS=$(echo "$E2E_CHECK" | jq -r '.status')
          E2E_CONCLUSION=$(echo "$E2E_CHECK" | jq -r '.conclusion')
          
          echo "E2E check:"
          echo "  Status: $E2E_STATUS"
          echo "  Conclusion: $E2E_CONCLUSION"
          
          if [ "$E2E_STATUS" != "completed" ]; then
            echo "❌ E2E check not completed (status: $E2E_STATUS). Blocking deployment."
            exit 1
          fi
          
          if [ "$E2E_CONCLUSION" != "success" ]; then
            echo "❌ E2E check did not succeed (conclusion: $E2E_CONCLUSION). Blocking deployment."
            exit 1
          fi
          
          echo "E2E: success (check completed)"
          echo "SHA consistency: OK (Checks API guarantees same SHA)"
          echo "DEPLOYMENT: APPROVED"
          echo ""
          echo "✅ All validations passed:"
          echo "   - CI check: completed + success"
          echo "   - E2E check: completed + success"
          echo "   - SHA consistency: OK (native guarantee)"
          echo "   - Deployment is authorized"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
