name: Deploy Gate

# This workflow is the single source of truth for deployment readiness.
# It validates that BOTH CI and E2E workflows have completed successfully
# for the SAME commit SHA using GitHub Actions Runs API.

on:
  workflow_run:
    workflows: ["CI", "E2E Tests"]
    types: [completed]
    branches: [main]

jobs:
  validate-deployment-readiness:
    name: Validate CI + E2E success for same SHA
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Validate deployment readiness
        run: |
          set -e
          
          TRIGGERING_SHA="${{ github.event.workflow_run.head_sha }}"
          TRIGGERING_WORKFLOW="${{ github.event.workflow_run.name }}"
          TRIGGERING_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          
          echo "=== Deploy Gate Validation (Workflow Runs API) ==="
          echo "Triggering workflow: $TRIGGERING_WORKFLOW"
          echo "Triggering SHA: $TRIGGERING_SHA"
          echo "Triggering conclusion: $TRIGGERING_CONCLUSION"
          
          # If triggering workflow failed, block immediately
          if [ "$TRIGGERING_CONCLUSION" != "success" ]; then
            echo "❌ Triggering workflow failed. Blocking deployment."
            exit 1
          fi
          
          # Fetch CI run for this exact SHA
          echo "=== Fetching CI run for SHA $TRIGGERING_SHA ==="
          CI_RUNS=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/runs?head_sha=$TRIGGERING_SHA&event=push" \
            --jq '.workflow_runs[] | select(.name == "CI")')
          
          if [ -z "$CI_RUNS" ]; then
            echo "❌ No CI run found for SHA $TRIGGERING_SHA. Blocking deployment."
            exit 1
          fi
          
          # Count matching CI runs - must be exactly 1
          CI_COUNT=$(echo "$CI_RUNS" | jq 'length')
          if [ "$CI_COUNT" -ne 1 ]; then
            echo "❌ Ambiguous CI runs found (count: $CI_COUNT). Blocking deployment."
            exit 1
          fi
          
          CI_STATUS=$(echo "$CI_RUNS" | jq -r '.status')
          CI_CONCLUSION=$(echo "$CI_RUNS" | jq -r '.conclusion')
          CI_HEAD_SHA=$(echo "$CI_RUNS" | jq -r '.head_sha')
          
          echo "CI run:"
          echo "  Status: $CI_STATUS"
          echo "  Conclusion: $CI_CONCLUSION"
          echo "  Head SHA: $CI_HEAD_SHA"
          
          if [ "$CI_STATUS" != "completed" ]; then
            echo "❌ CI run not completed (status: $CI_STATUS). Blocking deployment."
            exit 1
          fi
          
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "❌ CI run did not succeed (conclusion: $CI_CONCLUSION). Blocking deployment."
            exit 1
          fi
          
          if [ "$CI_HEAD_SHA" != "$TRIGGERING_SHA" ]; then
            echo "❌ CI run SHA mismatch. Expected: $TRIGGERING_SHA, Got: $CI_HEAD_SHA. Blocking deployment."
            exit 1
          fi
          
          echo "CI: success"
          
          # Fetch E2E run for this exact SHA
          echo "=== Fetching E2E run for SHA $TRIGGERING_SHA ==="
          E2E_RUNS=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/runs?head_sha=$TRIGGERING_SHA&event=push" \
            --jq '.workflow_runs[] | select(.name == "E2E Tests")')
          
          if [ -z "$E2E_RUNS" ]; then
            echo "❌ No E2E run found for SHA $TRIGGERING_SHA. Blocking deployment."
            exit 1
          fi
          
          # Count matching E2E runs - must be exactly 1
          E2E_COUNT=$(echo "$E2E_RUNS" | jq 'length')
          if [ "$E2E_COUNT" -ne 1 ]; then
            echo "❌ Ambiguous E2E runs found (count: $E2E_COUNT). Blocking deployment."
            exit 1
          fi
          
          E2E_STATUS=$(echo "$E2E_RUNS" | jq -r '.status')
          E2E_CONCLUSION=$(echo "$E2E_RUNS" | jq -r '.conclusion')
          E2E_HEAD_SHA=$(echo "$E2E_RUNS" | jq -r '.head_sha')
          
          echo "E2E run:"
          echo "  Status: $E2E_STATUS"
          echo "  Conclusion: $E2E_CONCLUSION"
          echo "  Head SHA: $E2E_HEAD_SHA"
          
          if [ "$E2E_STATUS" != "completed" ]; then
            echo "❌ E2E run not completed (status: $E2E_STATUS). Blocking deployment."
            exit 1
          fi
          
          if [ "$E2E_CONCLUSION" != "success" ]; then
            echo "❌ E2E run did not succeed (conclusion: $E2E_CONCLUSION). Blocking deployment."
            exit 1
          fi
          
          if [ "$E2E_HEAD_SHA" != "$TRIGGERING_SHA" ]; then
            echo "❌ E2E run SHA mismatch. Expected: $TRIGGERING_SHA, Got: $E2E_HEAD_SHA. Blocking deployment."
            exit 1
          fi
          
          echo "E2E: success"
          echo "SHA consistency: OK"
          echo "DEPLOYMENT: APPROVED"
          echo ""
          echo "✅ All validations passed:"
          echo "   - CI: success"
          echo "   - E2E: success"
          echo "   - SHA consistency: OK"
          echo "   - Deployment is authorized"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
