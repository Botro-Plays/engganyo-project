name: Deploy

# Triggers after Deploy Gate passes on main — builds Docker images, pushes to GHCR,
# then SSHes into VPS to pull pre-built images and restart containers.
# No building happens on the VPS; deploy time drops from ~15 min to ~3 min.
# Deploy Gate ensures both CI and E2E have succeeded for the same commit SHA.

on:
  workflow_run:
    workflows: ["Deploy Gate"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Lowercase repo path for GHCR (GHCR requires lowercase owner/repo)
  API_IMAGE: ghcr.io/botro-plays/engganyo-project/api
  WEB_IMAGE: ghcr.io/botro-plays/engganyo-project/web

jobs:
  # ─── Build & push Docker images to GHCR ───────────────────────────────────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (at the SHA that triggered workflow)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check Deploy Gate success before deploy
        run: |
          echo "Checking Deploy Gate status"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ Deploy Gate failed: blocking deploy"
            exit 1
          fi
          echo "✅ Deploy Gate succeeded: proceeding with deploy"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ─── SSH into VPS and deploy ───────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Forward GITHUB_TOKEN so VPS can authenticate to GHCR for the pull
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          API_IMAGE: ${{ env.API_IMAGE }}:latest
          WEB_IMAGE: ${{ env.WEB_IMAGE }}:latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,API_IMAGE,WEB_IMAGE
          script: |
            set -e
            cd /opt/engganyo-project

            # Sync config files: nginx.conf, docker-compose.yml, .env additions, etc.
            git pull origin main

            # Authenticate to GHCR (token is scoped to this workflow run)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull pre-built images (no building on VPS)
            docker pull "$API_IMAGE"
            docker pull "$WEB_IMAGE"

            # Stop and remove old containers to avoid name conflicts
            docker compose down

            # Start containers with new images
            docker compose up -d

            # Wait for API container to become ready
            sleep 8

            # Run any pending Prisma migrations
            docker compose exec -T api npx prisma migrate deploy

            # Seed database on first-ever deploy only
            if [ ! -f ".seeded" ]; then
              echo "Running initial database seed..."
              if docker compose exec -T api npx prisma db seed; then
                touch ".seeded"
                echo "Seed completed"
              else
                echo "WARNING: Seed failed — run manually: docker compose exec api npx prisma db seed"
              fi
            else
              echo "Database already seeded, skipping"
            fi

            echo "Deploy complete!"
