name: Deploy

# Triggers after E2E passes on main — builds Docker images, pushes to GHCR,
# then SSHes into VPS to pull pre-built images and restart containers.
# No building happens on the VPS; deploy time drops from ~15 min to ~3 min.
# E2E is used as the gate because it runs after CI (longer runtime) and
# we verify both CI and E2E status before deployment.

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Lowercase repo path for GHCR (GHCR requires lowercase owner/repo)
  API_IMAGE: ghcr.io/botro-plays/engganyo-project/api
  WEB_IMAGE: ghcr.io/botro-plays/engganyo-project/web

jobs:
  # ─── Build & push Docker images to GHCR ───────────────────────────────────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (at the SHA that triggered E2E)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify CI and E2E workflows passed
        run: |
          set -e
          SHA="${{ github.event.workflow_run.head_sha }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"

          echo "=== Verifying CI workflow status for SHA $SHA ==="
          CI_STATUS=$(gh run list --workflow=CI --branch="$BRANCH" --limit 1 --json conclusion,outcome --jq '.[0] | {conclusion, outcome}')
          CI_CONCLUSION=$(echo "$CI_STATUS" | jq -r '.conclusion')
          CI_OUTCOME=$(echo "$CI_STATUS" | jq -r '.outcome')

          echo "CI conclusion: $CI_CONCLUSION, outcome: $CI_OUTCOME"

          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "ERROR: CI workflow did not conclude success (status: $CI_CONCLUSION). Aborting deploy."
            exit 1
          fi

          if [ "$CI_OUTCOME" != "success" ]; then
            echo "ERROR: CI workflow outcome is not success (status: $CI_OUTCOME). Aborting deploy."
            exit 1
          fi

          echo "=== Verifying CI job outcomes ==="
          CI_RUN_ID=$(gh run list --workflow=CI --branch="$BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')

          API_JOB_OUTCOME=$(gh run view "$CI_RUN_ID" --json jobs --jq '.jobs[] | select(.name == "API — lint, test, build") | .outcome')
          WEB_JOB_OUTCOME=$(gh run view "$CI_RUN_ID" --json jobs --jq '.jobs[] | select(.name == "Web — lint, build") | .outcome')

          echo "CI/api job outcome: $API_JOB_OUTCOME"
          echo "CI/web job outcome: $WEB_JOB_OUTCOME"

          if [ "$API_JOB_OUTCOME" != "success" ]; then
            echo "ERROR: CI/api job did not succeed (outcome: $API_JOB_OUTCOME). Aborting deploy."
            exit 1
          fi

          if [ "$WEB_JOB_OUTCOME" != "success" ]; then
            echo "ERROR: CI/web job did not succeed (outcome: $WEB_JOB_OUTCOME). Aborting deploy."
            exit 1
          fi

          echo "=== Verifying E2E workflow status ==="
          E2E_STATUS=$(gh run list --workflow="E2E Tests" --branch="$BRANCH" --limit 1 --json conclusion,outcome --jq '.[0] | {conclusion, outcome}')
          E2E_CONCLUSION=$(echo "$E2E_STATUS" | jq -r '.conclusion')
          E2E_OUTCOME=$(echo "$E2E_STATUS" | jq -r '.outcome')

          echo "E2E conclusion: $E2E_CONCLUSION, outcome: $E2E_OUTCOME"

          if [ "$E2E_CONCLUSION" != "success" ]; then
            echo "ERROR: E2E workflow did not conclude success (status: $E2E_CONCLUSION). Aborting deploy."
            exit 1
          fi

          if [ "$E2E_OUTCOME" != "success" ]; then
            echo "ERROR: E2E workflow outcome is not success (status: $E2E_OUTCOME). Aborting deploy."
            exit 1
          fi

          echo "=== Verifying E2E job outcome ==="
          E2E_RUN_ID=$(gh run list --workflow="E2E Tests" --branch="$BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')

          E2E_JOB_OUTCOME=$(gh run view "$E2E_RUN_ID" --json jobs --jq '.jobs[] | select(.name == "Playwright E2E") | .outcome')

          echo "E2E/e2e job outcome: $E2E_JOB_OUTCOME"

          if [ "$E2E_JOB_OUTCOME" != "success" ]; then
            echo "ERROR: E2E/e2e job did not succeed (outcome: $E2E_JOB_OUTCOME). Aborting deploy."
            exit 1
          fi

          echo "=== All checks passed. Proceeding with deployment. ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ─── SSH into VPS and deploy ───────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Forward GITHUB_TOKEN so VPS can authenticate to GHCR for the pull
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          API_IMAGE: ${{ env.API_IMAGE }}:latest
          WEB_IMAGE: ${{ env.WEB_IMAGE }}:latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,API_IMAGE,WEB_IMAGE
          script: |
            set -e
            cd /opt/engganyo-project

            # Sync config files: nginx.conf, docker-compose.yml, .env additions, etc.
            git pull origin main

            # Authenticate to GHCR (token is scoped to this workflow run)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull pre-built images (no building on VPS)
            docker pull "$API_IMAGE"
            docker pull "$WEB_IMAGE"

            # Stop and remove old containers to avoid name conflicts
            docker compose down

            # Start containers with new images
            docker compose up -d

            # Wait for API container to become ready
            sleep 8

            # Run any pending Prisma migrations
            docker compose exec -T api npx prisma migrate deploy

            # Seed database on first-ever deploy only
            if [ ! -f ".seeded" ]; then
              echo "Running initial database seed..."
              if docker compose exec -T api npx prisma db seed; then
                touch ".seeded"
                echo "Seed completed"
              else
                echo "WARNING: Seed failed — run manually: docker compose exec api npx prisma db seed"
              fi
            else
              echo "Database already seeded, skipping"
            fi

            echo "Deploy complete!"
