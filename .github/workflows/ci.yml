name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── API: Lint + Test + Build ──────────────────────────────
  api:
    name: API — lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: engganyo_test
          POSTGRES_USER: engganyo
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://engganyo:test_pass@localhost:5432/engganyo_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_min_64_chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: ci_refresh_secret_min_64_chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      ENCRYPTION_KEY: ci-encryption-key-32-byte-hex-string-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Lint API
        run: npm run lint --workspace=apps/api

      - name: Test API (unit)
        run: npm test --workspace=apps/api

      - name: Build API
        run: npm run build --workspace=apps/api

  # ─── Web: Lint + Build ─────────────────────────────────────
  web:
    name: Web — lint, build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Web
        run: npm run lint --workspace=apps/web

      - name: Build Web
        run: npm run build --workspace=apps/web
