<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Abstract E with network nodes -->
  <g transform="translate(0, 4)">
    <circle cx="16" cy="16" r="14" fill="url(#logoGradient)"/>
    <!-- E shape with nodes -->
    <path d="M8 10 L24 10 L24 14 L13 14 L13 18 L22 18 L22 22 L13 22 L13 26 L24 26" 
          stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Network nodes -->
    <circle cx="10" cy="12" r="2" fill="white"/>
    <circle cx="22" cy="12" r="2" fill="white"/>
    <circle cx="10" cy="20" r="2" fill="white"/>
    <circle cx="22" cy="20" r="2" fill="white"/>
    <circle cx="16" cy="24" r="2" fill="white"/>
  </g>
  
  <!-- Text: ENGGANYO -->
  <text x="40" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="white" letter-spacing="1">
    ENGGANYO
  </text>
</svg>
