<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 218 52">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b62f5"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <!-- Icon mark (40×40, scaled from 64×64 via 0.625 factor, offset y=6 to centre vertically) -->
  <g transform="translate(0,6) scale(0.625)">
    <!-- Rounded-rect background -->
    <rect width="64" height="64" rx="16" fill="url(#bg)"/>
    <!-- Bold geometric E -->
    <rect x="12" y="13" width="7"  height="38" rx="3.5" fill="white"/>
    <rect x="12" y="13" width="28" height="7"  rx="3.5" fill="white"/>
    <rect x="12" y="28.5" width="21" height="7" rx="3"  fill="white"/>
    <rect x="12" y="44" width="28" height="7"  rx="3.5" fill="white"/>
    <!-- Amber star glow -->
    <circle cx="51" cy="13" r="9" fill="#FCD34D" opacity="0.14"/>
    <!-- 4-pointed star -->
    <path d="M51,7.5 L52.56,11.44 L56.5,13 L52.56,14.56 L51,18.5 L49.44,14.56 L45.5,13 L49.44,11.44 Z" fill="#FCD34D"/>
    <!-- Trailing sparkle dots -->
    <circle cx="54" cy="23" r="2"   fill="#FCD34D" opacity="0.45"/>
    <circle cx="56" cy="33" r="1.3" fill="#FCD34D" opacity="0.25"/>
  </g>

  <!-- Wordmark -->
  <text x="50" y="35"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="700"
        font-size="26"
        fill="white"
        letter-spacing="0.5">Engganyo</text>
</svg>
