version: '3.9'

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: engganyo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-engganyo_db}
      POSTGRES_USER: ${DATABASE_USER:-engganyo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-engganyo_dev_pass}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-engganyo} -d ${DATABASE_NAME:-engganyo_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - engganyo_network

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: engganyo_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - engganyo_network

  # ─── API (NestJS) ─────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: engganyo_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-engganyo}:${DATABASE_PASSWORD:-engganyo_dev_pass}@postgres:5432/${DATABASE_NAME:-engganyo_db}
      REDIS_URL: redis://redis:6379
    ports:
      - '${APP_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - engganyo_network

  # ─── Web (Next.js) ────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3001}/${API_PREFIX:-api/v1}
    container_name: engganyo_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3001}/${API_PREFIX:-api/v1}
    ports:
      - '3000:3000'
    depends_on:
      - api
    networks:
      - engganyo_network

  # ─── Nginx (Reverse Proxy) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: engganyo_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - engganyo_network

volumes:
  pgdata:
    name: engganyo_pgdata
  redisdata:
    name: engganyo_redisdata

networks:
  engganyo_network:
    name: engganyo_network
    driver: bridge
