services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: engganyo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-engganyo_db}
      POSTGRES_USER: ${DATABASE_USER:-engganyo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the VPS .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - engganyo_network

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: engganyo_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - engganyo_network

  # ─── API (NestJS) ─────────────────────────────────────────
  api:
    image: ${API_IMAGE:-ghcr.io/botro-plays/engganyo-project/api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: engganyo_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-engganyo}:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the VPS .env}@postgres:5432/${DATABASE_NAME:-engganyo_db}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
    ports:
      - '127.0.0.1:${APP_PORT:-3001}:3001'
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/health', {signal: AbortSignal.timeout(4000)}).then(async r => { const j = await r.json(); process.exit(r.ok && (j.data ?? j).status === 'ok' ? 0 : 1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - engganyo_network

  # ─── Web (Next.js) ────────────────────────────────────────
  web:
    image: ${WEB_IMAGE:-ghcr.io/botro-plays/engganyo-project/web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3001}/${API_PREFIX:-api}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    container_name: engganyo_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3001}/${API_PREFIX:-api}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - engganyo_network

  # ─── Nginx (Reverse Proxy) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: engganyo_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/opt/engganyo-project/infra/nginx/ssl:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/nginx-health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - engganyo_network

volumes:
  pgdata:
    name: engganyo_pgdata
  redisdata:
    name: engganyo_redisdata
  uploads_data:
    name: engganyo_uploads

networks:
  engganyo_network:
    name: engganyo_network
    driver: bridge
